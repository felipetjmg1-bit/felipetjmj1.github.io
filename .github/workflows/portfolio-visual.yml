name: Portfolio visual verification

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "portfolio.html"
      - "scripts/**"
      - ".github/workflows/portfolio-visual.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "portfolio.html"
      - "scripts/**"
      - ".github/workflows/portfolio-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/portfolio-server.log 2>&1 &
          echo $! > /tmp/portfolio-server.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/portfolio.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-server.log
          exit 1
      - name: Verify pages and capture screenshots
        run: node scripts/capture-portfolio.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impulso-digital-portfolio-screenshots
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
